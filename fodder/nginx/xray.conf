    proxy_read_timeout 86400;
    proxy_send_timeout 86400;

    proxy_pass http://127.0.0.1:10002;
  }

  # =====================
  # TROJAN WS
  # =====================
  location /trojan-ws {
    proxy_http_version 1.1;
